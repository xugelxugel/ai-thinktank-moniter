# AI 海外动态监测 · 每日云端流水线
# 每天 22:35 UTC（北京时间次日 06:35）自动运行：
#   monitor.py 抓取 → llm_analyze.py LLM分析 → gen_enhanced_from_json.py 生成简报
#   → publish_pages.py 发布到 docs/（GitHub Pages）+ 微信提醒 → 工作流方式部署 Pages
#
# 注意：schedule 的 cron 使用 UTC 时区（GitHub Actions 固定 UTC）。
#   "35 22 * * *" = 每天 22:35 UTC = 北京时间次日 06:35。
# 若定时任务未触发：推送一次本文件的微小改动（如改注释）即可让 GitHub
# 重新注册 cron（修改 workflow 文件会重置 schedule 注册）。
#
# GitHub Pages 启用（一次性）：仓库 Settings → Pages → Source 选 "GitHub Actions"
#   （v1.4.6 起改用官方 deploy-pages 工作流部署，绕开 branch 构建器超时问题；
#     v1.4.7 起 configure-pages 加 enablement:true 自动创建/切换站点模式）
#
# 首次配置：仓库 Settings → Secrets and variables → Actions → New repository secret
#   必填：LLM_API_KEY（Gemini 免费 Key）、WECHAT_NOTIFY_KEY（Server酱 SENDKEY 或 PushPlus token）
#   可选：LLM_FALLBACK_API_KEY（智谱 GLM 备用）、WECHAT_NOTIFY_TYPE（默认 serverchan）
# 手动测试：仓库 Actions 页面 → 本工作流 → Run workflow

name: AI Monitor Daily Briefing

on:
  schedule:
    - cron: "35 22 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-monitor-daily
  cancel-in-progress: false

jobs:
  daily-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # 先配置 Pages 站点（自动启用 + 切换为 GitHub Actions 部署模式），
      # 必须在 keepalive push 之前执行，否则 push 会触发分支构建器。
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ai_monitor/requirements.txt

      # 归档保留性自检：用临时 git 仓库做对照实验，确认"简报入库则历史保留、
      # 不入库则丢失"的归档逻辑未被改坏。纯本地操作，几秒完成。
      # 失败即中断，避免带着坏掉的归档逻辑继续跑（那样历史简报会静默丢失）。
      - name: Run archive retention test
        run: python ai_monitor/test_archive.py

      - name: Run daily briefing pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          WECHAT_NOTIFY_TYPE: ${{ secrets.WECHAT_NOTIFY_TYPE }}
          WECHAT_NOTIFY_KEY: ${{ secrets.WECHAT_NOTIFY_KEY }}
        run: python ai_monitor/run_daily.py

      # ---- GitHub Pages 工作流部署（官方推荐，纯文件上传，无构建超时）----
      # 首次启用/切换模式后，站点创建是异步的，直接 deploy 可能失败。
      # 轮询 Pages API 直到站点状态就绪（最多约 2 分钟）。
      - name: Wait for Pages site to be ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          REPO="${GITHUB_REPOSITORY}"
          for i in $(seq 1 12); do
            STATUS=$(curl -s -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/pages" \
              | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','missing'))" 2>/dev/null || echo missing)
            echo "  检查 $i/12: Pages status=$STATUS"
            if [ "$STATUS" != "missing" ] && [ "$STATUS" != "undefined" ] && [ "$STATUS" != "null" ]; then
              echo "  Pages 站点已就绪，开始部署"
              exit 0
            fi
            sleep 10
          done
          echo "  [警告] Pages 站点多次检查仍未就绪，继续尝试部署"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs
          include-hidden-files: true

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      # ---- 归档入库 + 仓库保活（必须在 Pages 部署之后）----
      # 关键：docs/ 里的当日简报（briefings/YYYY-MM-DD.html）、结构化数据
      # （data/YYYY-MM-DD.json）和归档索引 index.html 必须 commit 回仓库。
      # 原因：Pages 每次部署是"整包替换"，而 Actions 每次运行都是从 main
      # 全新 checkout —— 若历史简报不入库，下次运行时 docs/ 里只剩空壳，
      # 部署后前几天的简报就会从站点上消失（只剩当天那一份）。
      # 本工作流只由 schedule / workflow_dispatch 触发，此处的 push 不会
      # 递归触发新的运行。
      # 保活：持续更新 .keepalive 时间戳，防止 GitHub 因仓库 60 天无活动
      # 自动暂停 schedule 定时任务。
      - name: Archive briefings and keep repository active
        run: |
          echo "last_run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .keepalive
          git config user.name "ai-monitor-bot"
          git config user.email "actions@github.com"
          git add .keepalive docs
          if git diff --cached --quiet; then
            echo "  无新增简报，跳过提交"
            exit 0
          fi
          git commit -m "chore: archive briefing $(date -u '+%Y-%m-%d') + keepalive"
          git pull --ff-only || git pull --rebase || true
          git push || { echo "  [警告] 首次 push 失败，重试一次"; git pull --rebase; git push; }
