# AI 海外动态监测 · 每日云端流水线
# 每天 23:00 UTC（北京时间次日 07:00）自动运行：
#   monitor.py 抓取 → llm_analyze.py LLM分析 → gen_enhanced_from_json.py 生成简报
#   → publish_pages.py 发布到 docs/（GitHub Pages）+ 微信提醒
#
# GitHub Pages 启用（一次性）：仓库 Settings → Pages → Deploy from a branch → main + /docs
#
# 首次配置：仓库 Settings → Secrets and variables → Actions → New repository secret
#   必填：LLM_API_KEY（Gemini 免费 Key）、WECHAT_NOTIFY_KEY（Server酱 SENDKEY 或 PushPlus token）
#   可选：LLM_FALLBACK_API_KEY（智谱 GLM 备用）、WECHAT_NOTIFY_TYPE（默认 serverchan）
# 手动测试：仓库 Actions 页面 → 本工作流 → Run workflow

name: AI Monitor Daily Briefing

on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-monitor-daily
  cancel-in-progress: false

jobs:
  daily-briefing:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r ai_monitor/requirements.txt

      - name: Run daily briefing pipeline
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_FALLBACK_API_KEY: ${{ secrets.LLM_FALLBACK_API_KEY }}
          WECHAT_NOTIFY_TYPE: ${{ secrets.WECHAT_NOTIFY_TYPE }}
          WECHAT_NOTIFY_KEY: ${{ secrets.WECHAT_NOTIFY_KEY }}
        run: python ai_monitor/run_daily.py

      # 保活 + 发布：把 docs/（每日简报网页）和 .keepalive 时间戳一起提交推送。
      # GitHub Pages 会从 /docs 自动发布；同时仓库保持活跃，
      # 防止 GitHub 因 60 天无活动自动暂停定时任务。
      - name: Publish pages and keep repository active
        run: |
          echo "last_run: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" > .keepalive
          git config user.name "ai-monitor-bot"
          git config user.email "actions@github.com"
          git add docs/ .keepalive
          git commit -m "chore: publish briefing $(date -u '+%Y-%m-%d')" || echo "no changes to commit"
          git push
